<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RainKnights — pixel-art storm survival</title>
    <meta
      name="description"
      content="Play RainKnights, a browser survival game in the style of GBA Pokémon. A lone knight fights weather-born enemies as the storm closes in."
    />
    <link rel="canonical" href="https://rainknights.vercel.app/" />
    <meta name="theme-color" content="#181c38" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RainKnights" />
    <meta property="og:title" content="RainKnights — pixel-art storm survival" />
    <meta
      property="og:description"
      content="Play RainKnights, a browser survival game in the style of GBA Pokémon. A lone knight fights weather-born enemies as the storm closes in."
    />
    <meta property="og:url" content="https://rainknights.vercel.app/" />
    <meta property="og:image" content="https://rainknights.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RainKnights title art: three pixel knights standing in the rain" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RainKnights — pixel-art storm survival" />
    <meta
      name="twitter:description"
      content="Play RainKnights, a browser survival game in the style of GBA Pokémon. A lone knight fights weather-born enemies as the storm closes in."
    />
    <meta name="twitter:image" content="https://rainknights.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="RainKnights title art: three pixel knights standing in the rain" />

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preload" as="image" href="./splash.png" fetchpriority="high" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a12;
        pointer-events: none;
      }
      #boot-splash img {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 240px;
        height: 160px;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img
        id="boot-splash-img"
        src="./splash.png"
        alt="RainKnights title screen: three pixel knights standing in the rain"
        width="240"
        height="160"
        fetchpriority="high"
        decoding="sync"
      />
    </div>
    <div id="app"></div>
    <script>
      // Match the integer zoom Phaser applies, so the splash sits on the same pixels as the canvas.
      (function () {
        var img = document.getElementById('boot-splash-img');
        function fit() {
          var z = Math.max(1, Math.floor(Math.min(window.innerWidth / 240, window.innerHeight / 160)));
          img.style.width = 240 * z + 'px';
          img.style.height = 160 * z + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
